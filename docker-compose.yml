# Production: VM 130 on Proxmox (192.168.2.213), library from the Synology over NFS (read-only).
# Lives in /opt/3mf-library on the VM; ./data holds the index and preview cache.
services:
  3mf-library:
    # Built on the Mac with Podman and copied over (see README); never pulled from a registry.
    image: localhost/3mf-library:latest
    pull_policy: never
    container_name: 3mf-library
    user: "1000:1000"
    ports:
      - "8085:8080"
    # Per-server settings in /opt/3mf-library/.env (not in git, not overwritten by deploys):
    #   KNOWN_PROXIES=<IP of the Nginx Proxy Manager LXC>, once it proxies this site.
    # Accounts are created in the site itself (first run) and stored in ./data/users.db.
    env_file:
      - path: .env
        required: false
    environment:
      SITE_TITLE: "3D Print library"
      SCAN_INTERVAL: "00:03:00"
      IGNORE: "datapackage.json;._*;@eaDir;#recycle;#snapshot;Thumbs.db;desktop.ini;*.tmp"
      # Direct visitors from here need no login. Requests through a proxy always do.
      TRUSTED_NETWORKS: "192.168.2.0/24"
    volumes:
      - library:/library:ro
      - ./data:/data
    restart: unless-stopped
    # Keeps a very large model from taking the whole VM: the container stops at this, not the VM, and .NET sizes its
    # heap to 75% of it. Override with MEMORY_LIMIT in .env (e.g. 6g) if the VM has the room.
    mem_limit: ${MEMORY_LIMIT:-3g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  library:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.2.13,nfsvers=4.1,ro,soft,timeo=100"
      device: ":/volume1/3dprinting"
