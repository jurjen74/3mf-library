# 3MF Library: a self-hosted preview site for a folder of 3D print files (3MF, STL), mounted read-only.
#
# Settings go in a .env file next to this one: copy .env.example to .env and fill it in. Everything has a default,
# so the smallest setup is LIBRARY_DIR (where your models are) and, for logins without a password at home,
# TRUSTED_NETWORKS. A library on an NFS share: see compose.nfs.yml. Full guide: README.md.
services:
  3mf-library:
    image: ${IMAGE:-ghcr.io/jurjen74/3mf-library:latest}
    pull_policy: ${PULL_POLICY:-missing}
    container_name: 3mf-library
    # The user the app runs as: it must be able to read the library and write ./data (create it first:
    # mkdir data && chown <PUID>:<PGID> data).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8085}:8080"
    environment:
      SITE_TITLE: ${SITE_TITLE:-3D Print library}
      # Dates on the site ("Modified", "Added") are shown in this time zone, e.g. Europe/Amsterdam.
      TZ: ${TZ:-UTC}
      # Direct visitors from these networks need no login (e.g. 192.168.1.0/24). Requests through a proxy always do.
      TRUSTED_NETWORKS: ${TRUSTED_NETWORKS:-}
      # The reverse proxy's address, so the app sees visitors' real addresses and HTTPS.
      KNOWN_PROXIES: ${KNOWN_PROXIES:-}
      # Empty means the built-in default (see README.md).
      SCAN_INTERVAL: ${SCAN_INTERVAL:-}
      SETTLE_DELAY: ${SETTLE_DELAY:-}
      IGNORE: "${IGNORE:-}"
    volumes:
      - ${LIBRARY_DIR:-./library}:/library:ro
      - ./data:/data
    restart: unless-stopped
    # Keeps a very large model from taking the whole machine: the container stops at this, and .NET sizes its heap
    # to 75% of it. Big STLs and 3MFs need room; 3g is plenty for most libraries.
    mem_limit: ${MEMORY_LIMIT:-3g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
