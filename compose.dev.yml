# Local container test with Podman on the Mac, against ./dev-library:
#   podman compose -f compose.dev.yml up --build
services:
  3mf-library:
    build: .
    image: 3mf-library:dev
    ports:
      - "8085:8080"
    environment:
      SCAN_INTERVAL: "00:01:00"
    volumes:
      - ./dev-library:/library:ro
      - ./data-container:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
