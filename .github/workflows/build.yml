# Tests on every push and pull request. Pushes to main and version tags (v1.2.3) also publish the container image
# to the GitHub Container Registry as ghcr.io/<owner>/<repo>, for amd64 and arm64 (Synology, Raspberry Pi, Apple
# silicon). Tags: latest (main), 1.2.3 and 1.2 (version tags), sha-<commit> (every published build).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation-only changes don't need a new image (they have their own workflow, docs.yml).
    paths-ignore: ["docs/**", ".github/workflows/docs.yml", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", ".github/workflows/docs.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test Library.slnx

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      # The Dockerfile builds on the runner's own architecture and lets the .NET SDK cross-compile for each target,
      # so the arm64 image needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
